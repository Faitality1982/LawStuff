<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1b3a5c">
<title>Patient Survey</title>
<!-- Inline data URI rather than a file: no extra request, and no 404 on every
     page load from the browser's implicit /favicon.ico fetch. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b3a5c'/%3E%3Cpath d='M5 16h4l3-7 4 14 3-9 2.5 5H27' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="bar" role="banner">
  <div class="bar-inner">
    <div class="brand" id="brand"></div>
    <div class="counter" id="counter" aria-hidden="true"></div>
  </div>
  <div class="progress" role="progressbar" aria-label="Survey progress"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar">
    <div class="progress-fill" id="progressfill"></div>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Live region: screen changes are announced here for screen readers,
       since we swap content without a page navigation. -->
  <div class="sr-only" aria-live="polite" id="announce"></div>
  <div id="screen" class="screen"></div>

  <!-- Honeypot. Positioned off-screen rather than display:none — a fair number
       of bots skip display:none fields but happily fill positioned ones. A
       human never sees or tabs to it, so anything in here means automation and
       the submission is dropped client-side. Costs nothing in anonymity. -->
  <div class="hp" aria-hidden="true">
    <label for="hp_website">Website</label>
    <input type="text" id="hp_website" name="website" tabindex="-1" autocomplete="off">
  </div>
</main>

<footer class="nav" role="navigation">
  <button type="button" id="back" class="btn btn-ghost">Back</button>
  <button type="button" id="next" class="btn btn-primary">Next</button>
</footer>

<noscript>
  <div class="noscript">
    This survey needs JavaScript enabled. If you can’t enable it, please let the
    front desk know and they’ll get you a paper copy.
  </div>
</noscript>

<script src="/config.js"></script>
<script src="/questions.js"></script>
<script src="/survey.js"></script>
</body>
</html>
